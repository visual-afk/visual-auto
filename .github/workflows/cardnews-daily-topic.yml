name: cardnews-daily-topic

on:
  schedule:
    - cron: '0 23 * * *' # 매일 08:00 KST (23:00 UTC)
  workflow_dispatch:

env:
  GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
  GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
  GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
  GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
  GOOGLE_DOCS_FOLDER_ID: ${{ secrets.GOOGLE_DOCS_FOLDER_ID }}
  GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}

jobs:
  today:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 편성표 → 시트 (새 날짜만, 사용자 수정 보존)
        run: npx tsx scripts/cardnews-topic-sync.ts --seed
      - name: 시트 → 캘린더 (60일 롤링 업서트)
        run: npx tsx scripts/cardnews-topic-sync.ts --calendar --days 60
      - name: 오늘의 주제 → Google Chat
        run: npx tsx scripts/cardnews-topic-sync.ts --today
